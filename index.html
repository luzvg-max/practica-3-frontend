<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Libros</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>Gestión de Libros</h1>
        <p>Visualización de información desde una API REST</p>
    </header>

    <main>
        <section>
            <h2>Libros registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Autor</th>
                        <th>Categoría</th>
                    </tr>
                </thead>
                <tbody id="tabla-libros"></tbody>
            </table>
        </section>

        <section>
            <h2>Libros por categoría</h2>
            <canvas id="graficaLibros"></canvas>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
